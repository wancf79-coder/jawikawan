<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5f4bd8">
  <meta name="description" content="JawiKawan — permainan belajar Jawi dan membaca Bahasa Melayu untuk anak 5 hingga 8 tahun.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>JawiKawan</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Laman utama"><span class="brand-mark">ج</span><span><b>JawiKawan</b><small>Belajar • Main • Hebat!</small></span></button>
      <div class="top-stats" aria-label="Pencapaian"><span title="Jumlah bintang">⭐ <b id="starCount">0</b></span><span title="Mata pengalaman">⚡ <b id="xpCount">0</b></span></div>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Navigasi utama"><button class="nav-btn active" data-go="home"><span>🏠</span>Utama</button><button class="nav-btn" data-go="learn"><span>🗺️</span>Belajar</button><button class="nav-btn" data-go="rewards"><span>🎁</span>Ganjaran</button><button class="nav-btn" data-go="parent"><span>👨‍👩‍👧</span>Ibu Bapa</button></nav>
  </div>
  <dialog id="profileDialog" class="modal"><form method="dialog" id="profileForm"><div class="mascot small">🐯</div><h2>Siapa nama kawan baru kami?</h2><p>Maklumat ini hanya disimpan pada peranti ini.</p><label>Nama panggilan<input id="childName" maxlength="16" placeholder="Contoh: Aisyah" required></label><label>Umur<select id="childAge"><option>5</option><option>6</option><option selected>7</option><option>8</option></select></label><button class="primary full" value="save">Mula pengembaraan 🚀</button></form></dialog>
  <dialog id="gateDialog" class="modal"><form method="dialog" id="gateForm"><h2>Untuk ibu atau ayah 👋</h2><p id="gateQuestion">Selesaikan soalan ini.</p><label>Jawapan<input id="gateAnswer" inputmode="numeric" required></label><p id="gateError" class="error" hidden>Jawapan belum betul. Cuba lagi.</p><div class="dialog-actions"><button class="ghost" value="cancel">Batal</button><button class="primary" value="submit">Teruskan</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div><script src="app.js"></script>
</body></html>
