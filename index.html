<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16a06b">
  <title>RimbaRia — Teka Haiwan</title>
  <style>
    :root{--green:#16a06b;--green2:#087d58;--navy:#17344d;--cream:#fffaf0;--yellow:#ffd447;--coral:#ff735c;--blue:#55bde8;--card:#fff;--ink:#17344d;--muted:#708296;--shadow:0 14px 34px rgba(25,70,68,.13)}
    *{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#ecfff7 0,#fffaf0 48%,#f3f7ff 100%);min-height:100vh}.app{max-width:780px;margin:auto;min-height:100vh;padding:0 18px 100px}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 4px;background:rgba(236,255,247,.9);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:900}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:var(--green);box-shadow:0 8px 20px rgba(22,160,107,.25);font-size:24px}.stats{display:flex;gap:7px}.pill{background:#fff;border:1px solid #dcebe5;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:900;box-shadow:0 6px 18px rgba(32,66,70,.08)}button{font:inherit;color:inherit}.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(135deg,#087d58,#21b97c);padding:25px 22px;color:#fff;box-shadow:var(--shadow);margin:8px 0 24px}.hero:after{content:"🐘 🐒 🦁";position:absolute;right:-18px;bottom:-8px;font-size:54px;opacity:.25;transform:rotate(-6deg)}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:#d8ffed}.hero h1{font-size:36px;line-height:1;margin:8px 0}.hero p{margin:0 0 18px;max-width:430px;font-weight:700}.primary,.secondary,.ghost{border:0;border-radius:16px;padding:13px 17px;font-weight:900;cursor:pointer}.primary{background:var(--yellow);color:#503d00;box-shadow:0 7px 0 #d5aa16}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #d5aa16}.secondary{background:#e8fff5;color:var(--green2)}.ghost{background:#fff;border:1px solid #dbe7e4}.section-title{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.section-title h2{margin:0;font-size:23px}.section-title small{color:var(--muted);font-weight:800}.worlds{display:grid;gap:13px}.world{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:14px;background:#fff;border:1px solid #e3ece8;border-radius:22px;padding:15px;box-shadow:0 8px 25px rgba(32,66,70,.08);cursor:pointer;text-align:left}.world-icon{display:grid;place-items:center;height:68px;border-radius:19px;font-size:38px}.farm{background:#fff3cc}.jungle{background:#dffff0}.ocean{background:#dff5ff}.world h3{margin:0 0 4px;font-size:18px}.world p{margin:0;color:var(--muted);font-size:13px;font-weight:700}.go{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-weight:900}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#fff;border:1px solid #e1ebe8;border-radius:18px;padding:14px 8px;text-align:center}.mini b{display:block;font-size:22px}.mini small{color:var(--muted);font-weight:800}.bottom-nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;width:min(720px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border:1px solid #dfe8e5;border-radius:22px;box-shadow:0 16px 35px rgba(23,52,77,.18)}.nav{border:0;background:transparent;border-radius:16px;padding:9px 6px;color:#738394;font-size:12px;font-weight:900;cursor:pointer}.nav span{display:block;font-size:20px}.nav.active{background:#e6fff3;color:var(--green2)}.quiz-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin:12px 0}.back{border:0;background:#fff;border-radius:13px;width:44px;height:44px;font-size:21px}.progress{height:12px;background:#e2ebe7;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ff9f43);border-radius:inherit;transition:.35s}.hearts{font-size:19px;white-space:nowrap}.picture-card{position:relative;display:grid;place-items:center;min-height:290px;border-radius:30px;background:radial-gradient(circle at 50% 42%,#fff 0 25%,#e8fff5 26% 100%);border:2px solid #d8eee5;box-shadow:var(--shadow);margin:18px 0}.animal-picture{font-size:128px;filter:drop-shadow(0 13px 8px rgba(23,52,77,.13));animation:float 2.7s ease-in-out infinite}.question-label{position:absolute;top:18px;background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:900;color:var(--green2)}@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{min-height:65px;border:2px solid #dde9e5;background:#fff;border-radius:18px;padding:10px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #dce7e3}.answer:active{transform:translateY(3px);box-shadow:0 2px 0 #dce7e3}.answer.correct{background:#dffbea;border-color:#25ad70;color:#087d58}.answer.wrong{background:#ffe6e2;border-color:#ff735c;color:#9c3324}.answer.dim{opacity:.48}.feedback{margin-top:14px;border-radius:20px;padding:16px;text-align:center;font-weight:900;animation:pop .25s ease}.feedback.good{background:#dffbea;color:#087d58}.feedback.bad{background:#ffe6e2;color:#9c3324}.feedback h3{margin:0 0 4px;font-size:21px}.feedback p{margin:0;font-weight:800}.listen{margin-top:10px;border:0;background:#fff;border-radius:999px;padding:8px 13px;font-weight:900}.hidden{display:none!important}@keyframes pop{from{transform:scale(.92);opacity:0}}.result{text-align:center;padding:30px 12px}.trophy{font-size:92px}.stars-big{font-size:40px;letter-spacing:5px}.result-card{background:#fff;border-radius:24px;padding:19px;margin:20px 0;box-shadow:var(--shadow)}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.animal-tile{background:#fff;border:1px solid #e1ebe8;border-radius:20px;padding:14px 6px;text-align:center}.animal-tile .emo{font-size:48px}.animal-tile b{display:block;font-size:14px}.animal-tile small{color:var(--muted)}.animal-tile.locked{filter:grayscale(1);opacity:.35}.parent{background:linear-gradient(135deg,#17344d,#245a75);color:#fff;border-radius:26px;padding:23px;margin-bottom:18px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:17px;padding:14px}.metric b{display:block;font-size:26px}.metric small{color:#cfe5ee}.dialog{border:0;border-radius:25px;padding:0;width:min(92%,430px);box-shadow:0 30px 70px rgba(0,0,0,.3)}.dialog::backdrop{background:rgba(10,35,42,.55);backdrop-filter:blur(5px)}.dialog-body{padding:24px}.dialog h2{margin-top:0}.field{display:grid;gap:6px;margin:13px 0}.field label{font-weight:900;font-size:13px}.field input,.field select{border:2px solid #dce9e5;border-radius:14px;padding:12px;font:inherit}.row{display:flex;gap:10px}.row>*{flex:1}.note{background:#fff7d8;border-radius:16px;padding:12px;color:#705a00;font-size:13px;font-weight:800}.danger{color:#b53b2b;border-color:#ffc7bf}.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#17344d;color:#fff;border-radius:999px;padding:11px 17px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.app{padding-inline:13px}.hero h1{font-size:31px}.picture-card{min-height:265px}.animal-picture{font-size:112px}.answers{grid-template-columns:1fr}.collection{grid-template-columns:repeat(3,1fr)}.world{grid-template-columns:64px 1fr auto}.world-icon{height:59px}.topbar{padding-top:max(10px,env(safe-area-inset-top))}}
  </style>
  <link rel="stylesheet" href="enhancements.css">
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="brand-mark">🐾</div>RimbaRia</div><div class="stats"><div class="pill">⭐ <span id="starCount">0</span></div><div class="pill">⚡ <span id="xpCount">0</span></div></div></header>
  <main id="main"></main>
</div>
<nav class="bottom-nav"><button class="nav active" data-view="home"><span>🏠</span>Utama</button><button class="nav" data-view="collection"><span>🦁</span>Koleksi</button><button class="nav" data-view="parent"><span>📊</span>Ibu Bapa</button></nav>
<div id="toast" class="toast"></div>
<dialog id="profileDialog" class="dialog"><form method="dialog" id="profileForm" class="dialog-body"><h2>Selamat datang! 👋</h2><p>Mari sediakan profil pemain kecil.</p><div class="field"><label>Nama panggilan anak</label><input id="childName" maxlength="18" required placeholder="Contoh: Aiman"></div><div class="field"><label>Umur</label><select id="childAge"><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option></select></div><button class="primary" style="width:100%">Mula bermain</button></form></dialog>
<dialog id="gateDialog" class="dialog"><form method="dialog" id="gateForm" class="dialog-body"><h2>Untuk ibu bapa 🔐</h2><p id="gateQuestion"></p><div class="field"><input id="gateAnswer" inputmode="numeric" required></div><p id="gateError" class="note hidden">Jawapan belum tepat.</p><div class="row"><button value="cancel" class="ghost">Batal</button><button value="ok" class="primary">Buka</button></div></form></dialog>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const WORLDS=[
 {id:'farm',name:'Haiwan Ladang',icon:'🚜',class:'farm',desc:'Kenali haiwan yang dekat dengan kita',animals:[
  {id:'cat',ms:'Kucing',en:'Cat',emoji:'🐱'},{id:'dog',ms:'Anjing',en:'Dog',emoji:'🐶'},{id:'cow',ms:'Lembu',en:'Cow',emoji:'🐄'},{id:'goat',ms:'Kambing',en:'Goat',emoji:'🐐'},{id:'sheep',ms:'Biri-biri',en:'Sheep',emoji:'🐑'},{id:'horse',ms:'Kuda',en:'Horse',emoji:'🐴'},{id:'chicken',ms:'Ayam',en:'Chicken',emoji:'🐔'},{id:'duck',ms:'Itik',en:'Duck',emoji:'🦆'},{id:'rabbit',ms:'Arnab',en:'Rabbit',emoji:'🐰'},{id:'pig',ms:'Babi',en:'Pig',emoji:'🐷'}]},
 {id:'jungle',name:'Haiwan Hutan',icon:'🌴',class:'jungle',desc:'Jelajah rimba dan haiwan liar',animals:[
  {id:'lion',ms:'Singa',en:'Lion',emoji:'🦁'},{id:'tiger',ms:'Harimau',en:'Tiger',emoji:'🐯'},{id:'elephant',ms:'Gajah',en:'Elephant',emoji:'🐘'},{id:'monkey',ms:'Monyet',en:'Monkey',emoji:'🐒'},{id:'giraffe',ms:'Zirafah',en:'Giraffe',emoji:'🦒'},{id:'zebra',ms:'Kuda belang',en:'Zebra',emoji:'🦓'},{id:'bear',ms:'Beruang',en:'Bear',emoji:'🐻'},{id:'deer',ms:'Rusa',en:'Deer',emoji:'🦌'},{id:'crocodile',ms:'Buaya',en:'Crocodile',emoji:'🐊'},{id:'snake',ms:'Ular',en:'Snake',emoji:'🐍'}]},
 {id:'ocean',name:'Haiwan Laut',icon:'🌊',class:'ocean',desc:'Selami dunia biru yang menakjubkan',animals:[
  {id:'dolphin',ms:'Ikan lumba-lumba',en:'Dolphin',emoji:'🐬'},{id:'whale',ms:'Ikan paus',en:'Whale',emoji:'🐋'},{id:'shark',ms:'Ikan yu',en:'Shark',emoji:'🦈'},{id:'octopus',ms:'Sotong kurita',en:'Octopus',emoji:'🐙'},{id:'turtle',ms:'Penyu',en:'Sea turtle',emoji:'🐢'},{id:'crab',ms:'Ketam',en:'Crab',emoji:'🦀'},{id:'fish',ms:'Ikan',en:'Fish',emoji:'🐟'},{id:'penguin',ms:'Penguin',en:'Penguin',emoji:'🐧'},{id:'seal',ms:'Anjing laut',en:'Seal',emoji:'🦭'},{id:'seahorse',ms:'Kuda laut',en:'Seahorse',emoji:'🦐'}]}
];
const ALL=WORLDS.flatMap(w=>w.animals.map(a=>({...a,world:w.id})));
const DEFAULT={profile:null,stars:0,xp:0,attempts:0,correct:0,completed:{},unlocked:[],history:[]};
let state=load(),quiz=null,gateAnswer=0;
function load(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem('rimbara-v1')||'{}')}}catch{return {...DEFAULT}}}
function save(){localStorage.setItem('rimbara-v1',JSON.stringify(state));syncStats()}
function syncStats(){$('#starCount').textContent=state.stars||0;$('#xpCount').textContent=state.xp||0}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}
function setView(v){if(v==='parent')return openGate();$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({home:renderHome,collection:renderCollection}[v]||renderHome)();scrollTo({top:0,behavior:'smooth'})}
function renderHome(){const name=state.profile?.name||'Kawan';$('#main').innerHTML=`<section class="hero"><span class="eyebrow">Hai ${name}! Misi hari ini</span><h1>Teka Siapa Saya?</h1><p>Lihat gambar, pilih nama yang betul dan kumpul bintang!</p><button class="primary" data-random>🎮 Main pantas</button></section><div class="mini-grid"><div class="mini"><b>${state.unlocked.length}/30</b><small>Haiwan ditemui</small></div><div class="mini"><b>${accuracy()}%</b><small>Ketepatan</small></div><div class="mini"><b>${state.completed.total||0}</b><small>Permainan</small></div></div><div class="section-title"><div><small>Pilih pengembaraan</small><h2>3 Dunia Haiwan</h2></div></div><div class="worlds">${WORLDS.map(w=>`<button class="world" data-world="${w.id}"><span class="world-icon ${w.class}">${w.icon}</span><span><h3>${w.name}</h3><p>${w.desc} • ${worldFound(w.id)}/10 ditemui</p></span><span class="go">▶</span></button>`).join('')}</div>`}
function accuracy(){return state.attempts?Math.round(state.correct/state.attempts*100):0}
function worldFound(id){return WORLDS.find(w=>w.id===id).animals.filter(a=>state.unlocked.includes(a.id)).length}
function startQuiz(worldId){const world=WORLDS.find(w=>w.id===worldId)||WORLDS[Math.floor(Math.random()*WORLDS.length)];quiz={world,index:0,score:0,hearts:3,locked:false,questions:shuffle(world.animals).map(target=>({target,choices:shuffle([target,...shuffle(world.animals.filter(a=>a.id!==target.id)).slice(0,3)])}))};renderQuestion()}
function renderQuestion(){const q=quiz.questions[quiz.index];$('#main').innerHTML=`<div class="quiz-head"><button class="back" data-back>←</button><div><small>${quiz.world.name} • ${quiz.index+1}/10</small><div class="progress"><i style="width:${quiz.index*10}%"></i></div></div><div class="hearts">${'❤️'.repeat(quiz.hearts)}${'🤍'.repeat(3-quiz.hearts)}</div></div><section class="picture-card"><span class="question-label">Apakah nama haiwan ini?</span><div class="animal-picture">${q.target.emoji}</div></section><div class="answers">${q.choices.map(a=>`<button class="answer" data-answer="${a.id}">${a.ms}</button>`).join('')}</div><div id="feedback"></div>`}
function answer(id){if(quiz.locked)return;quiz.locked=true;const q=quiz.questions[quiz.index],ok=id===q.target.id;state.attempts++;if(ok){quiz.score++;state.correct++;state.stars++;state.xp+=10;if(!state.unlocked.includes(q.target.id))state.unlocked.push(q.target.id)}else quiz.hearts=Math.max(0,quiz.hearts-1);$$('.answer').forEach(b=>{if(b.dataset.answer===q.target.id)b.classList.add('correct');else if(b.dataset.answer===id)b.classList.add('wrong');else b.classList.add('dim')});const box=$('#feedback');box.className=`feedback ${ok?'good':'bad'}`;box.innerHTML=`<h3>${ok?'Hebat! Jawapan kamu betul!':'Hampir! Cuba lagi nanti.'}</h3><p>${q.target.emoji} ${q.target.ms} • ${q.target.en}</p><button class="listen" data-listen="${q.target.id}">🔊 Dengar nama</button>`;save();playFeedback(ok);setTimeout(()=>{quiz.index++;quiz.locked=false;if(quiz.index>=quiz.questions.length||quiz.hearts===0)finishQuiz();else renderQuestion()},2100)}
function finishQuiz(){const stars=quiz.score>=9?3:quiz.score>=6?2:1;state.stars+=stars;state.xp+=quiz.score*5;state.completed.total=(state.completed.total||0)+1;state.completed[quiz.world.id]=(state.completed[quiz.world.id]||0)+1;state.history.unshift({world:quiz.world.name,score:quiz.score,date:new Date().toISOString()});state.history=state.history.slice(0,12);save();$('#main').innerHTML=`<section class="result"><div class="trophy">${quiz.score>=9?'🏆':'🦁'}</div><h1>${quiz.score>=9?'Cemerlang!':'Syabas, teruskan!'}</h1><div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="result-card"><h2>${quiz.score}/10 betul</h2><p>Anda memperoleh +${quiz.score*5} XP dan ${stars} bintang bonus.</p></div><div class="row"><button class="ghost" data-home>Utama</button><button class="primary" data-world="${quiz.world.id}">Main lagi</button></div></section>`}
function renderCollection(){$('#main').innerHTML=`<div class="section-title"><div><small>Album penemuan</small><h2>Koleksi Haiwan</h2></div><small>${state.unlocked.length}/30</small></div>${WORLDS.map(w=>`<h3>${w.icon} ${w.name}</h3><div class="collection">${w.animals.map(a=>`<div class="animal-tile ${state.unlocked.includes(a.id)?'':'locked'}"><div class="emo">${state.unlocked.includes(a.id)?a.emoji:'❓'}</div><b>${state.unlocked.includes(a.id)?a.ms:'Belum ditemui'}</b><small>${state.unlocked.includes(a.id)?a.en:'Main untuk buka'}</small></div>`).join('')}</div>`).join('')}`}
function openGate(){const a=2+Math.floor(Math.random()*7),b=2+Math.floor(Math.random()*7);gateAnswer=a*b;$('#gateQuestion').textContent=`Berapakah ${a} × ${b}?`;$('#gateAnswer').value='';$('#gateError').classList.add('hidden');$('#gateDialog').showModal()}
function renderParent(){$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view==='parent'));$('#main').innerHTML=`<section class="parent"><small>DASHBOARD IBU BAPA</small><h1>Prestasi ${state.profile?.name||'Anak'}</h1><div class="metrics"><div class="metric"><b>${accuracy()}%</b><small>Ketepatan</small></div><div class="metric"><b>${state.unlocked.length}/30</b><small>Haiwan ditemui</small></div><div class="metric"><b>${state.completed.total||0}</b><small>Permainan selesai</small></div><div class="metric"><b>${state.xp}</b><small>Jumlah XP</small></div></div></section><h2>Aktiviti terkini</h2>${state.history.length?state.history.map(h=>`<div class="world"><span class="world-icon farm">🎮</span><span><h3>${h.world}</h3><p>${new Date(h.date).toLocaleDateString('ms-MY')}</p></span><b>${h.score}/10</b></div>`).join(''):'<p>Belum ada aktiviti.</p>'}<div class="section-title"><h2>Tetapan</h2></div><div class="row"><button class="ghost" id="editProfile">✏️ Profil</button><button class="ghost danger" id="reset">🗑️ Padam kemajuan</button></div>`}
function playFeedback(ok){playFile(ok?'audio/correct.mp3':'audio/wrong.mp3').catch(()=>chime(ok))}
function playFile(src){return new Promise((resolve,reject)=>{const a=new Audio(src);a.onended=resolve;a.onerror=reject;a.play().catch(reject)})}
function chime(ok){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(ok?660:210,c.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(990,c.currentTime+.18);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.32);o.start();o.stop(c.currentTime+.33)}catch{}}
function listenAnimal(id){playFile(`audio/animals/${id}.mp3`).catch(()=>toast('Audio haiwan belum ditambah'))}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v)return setView(v.dataset.view);const w=e.target.closest('[data-world]');if(w)return startQuiz(w.dataset.world);if(e.target.closest('[data-random]'))return startQuiz(WORLDS[Math.floor(Math.random()*3)].id);const a=e.target.closest('[data-answer]');if(a)return answer(a.dataset.answer);const l=e.target.closest('[data-listen]');if(l)return listenAnimal(l.dataset.listen);if(e.target.closest('[data-back],[data-home]'))return setView('home');if(e.target.closest('#editProfile')){ $('#childName').value=state.profile?.name||'';$('#childAge').value=state.profile?.age||6;$('#profileDialog').showModal()}if(e.target.closest('#reset')&&confirm('Padam semua bintang dan kemajuan?')){const profile=state.profile;state={...DEFAULT,profile,completed:{},unlocked:[],history:[]};save();renderParent();toast('Kemajuan dipadam')}});
$('#profileForm').addEventListener('submit',()=>{state.profile={name:$('#childName').value.trim(),age:Number($('#childAge').value)};save();renderHome()});
$('#gateForm').addEventListener('submit',e=>{if(e.submitter?.value==='cancel')return;if(Number($('#gateAnswer').value)!==gateAnswer){e.preventDefault();$('#gateError').classList.remove('hidden');return}setTimeout(renderParent)});
syncStats();renderHome();if(!state.profile)setTimeout(()=>$('#profileDialog').showModal(),250);
</script>
<script src="audio-engine.js"></script>
<script src="game-upgrade.js"></script>
</body>
</html>
